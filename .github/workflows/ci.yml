name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter 포맷·분석·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 로컬과 같은 버전을 쓰도록 fvm 설정 파일에서 읽는다.
      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # Flutter 설치용으로 가장 널리 쓰이는 커뮤니티 Action(subosito/flutter-action). SDK를 캐시한다.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # 다른 Flutter 버전으로 lock 파일이 바뀐 채 올라오면 여기서 막는다.
      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test testing

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  firestore-rules:
    name: Firestore 보안 규칙 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # Firestore 에뮬레이터는 Java 21 이상이 필요하다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install test packages
        run: npm --prefix firestore-tests ci

      # demo- 프로젝트라 실제 Firebase 프로젝트에 닿지 않고 로그인도 필요 없다.
      - name: Run rules tests on emulator
        run: >-
          npx --yes firebase-tools@15.20.0 emulators:exec
          --only firestore
          --project demo-shared-ledger
          "npm --prefix firestore-tests test"

  # 공휴일을 받아 두는 Cloud Functions(functions/). 타입 검사·빌드와 응답 해석 테스트만 하고 배포는 하지 않는다.
  functions:
    name: Cloud Functions 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 배포되는 런타임(package.json의 engines)과 같은 Node 22로 검사한다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install packages
        run: npm --prefix functions ci

      - name: Build and test
        run: npm --prefix functions test

  android-build:
    name: Android 디버그 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter 설치용으로 가장 널리 쓰이는 커뮤니티 Action(subosito/flutter-action). SDK를 캐시한다.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # Gradle 사가 관리하는 공식 Action. flutter build apk가 내부에서 부르는 Gradle의
      # 의존성·배포판을 캐시한다. 캐시는 main 실행에서만 쓰고 PR에서는 읽기만 한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug
