name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro-changes:
    name: Maestro 실행 조건 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Test Maestro backend readiness
        run: node --test .github/scripts/maestro-reset.test.cjs

      - name: Check app-related changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/maestro_changes.py

  maestro-smoke:
    name: Maestro 스모크 테스트
    needs: maestro-changes
    if: needs.maestro-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAESTRO_VERSION: 2.1.0
      API_LEVEL: 34
      AVD_CACHE_VERSION: 1
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Build Maestro debug APK
        run: >-
          flutter build apk --debug --target testing/maestro_main.dart
          --dart-define=MAESTRO_FIREBASE_HOST=10.0.2.2

      # APK 빌드는 기존 Android job과 같은 17, Firebase 에뮬레이터 실행은 21을 쓴다.
      - name: Set up JDK 21 for Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install test tools
        run: |
          npm install --global firebase-tools@15.20.0
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          chmod +x "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/avd/*
          key: maestro-avd-${{ runner.os }}-${{ env.API_LEVEL }}-google_apis-x86_64-4core-4096M-v${{ env.AVD_CACHE_VERSION }}

      - name: Create settled AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/emulator-settle.sh 300

      - name: Run Maestro smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/emulator-settle.sh 120
            bash .github/scripts/maestro-smoke.sh

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-results
          path: |
            build/maestro/
            *-debug.log
          if-no-files-found: ignore
          retention-days: 7

  maestro-smoke-ios:
    name: iOS Maestro 스모크 테스트
    needs: maestro-changes
    if: needs.maestro-changes.outputs.run == 'true'
    runs-on: xcode-27
    # 단계별 상한 합계 69분에 setup·cleanup 여유를 더한다.
    timeout-minutes: 75
    env:
      MAESTRO_VERSION: 2.1.0
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
      MAESTRO_CLI_NO_ANALYTICS: 1
      SIMULATOR_NAME: iPhone 17 Pro
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Flutter version
        timeout-minutes: 1
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        timeout-minutes: 5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up JDK 21 for Firebase and Maestro
        timeout-minutes: 2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        timeout-minutes: 2
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install packages
        timeout-minutes: 3
        run: flutter pub get --enforce-lockfile

      - name: Install test tools
        timeout-minutes: 5
        run: |
          npm install --global firebase-tools@15.20.0
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          chmod +x "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        timeout-minutes: 2
        run: |
          IOS_SIMULATOR_UDID=$(bash .github/scripts/ios-simulator-udid.sh "$SIMULATOR_NAME")
          test -n "$IOS_SIMULATOR_UDID" || { echo "::error::iOS simulator not found"; exit 1; }
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_SIMULATOR_UDID" || true

      - name: Build Maestro iOS simulator app
        timeout-minutes: 25
        run: flutter build ios --simulator --debug --target testing/maestro_main.dart

      - name: Run iOS Maestro smoke flows
        # 테스트가 멈춰도 job 전체 제한 전에 진단·artifact 수집 시간을 남긴다.
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
          bash .github/scripts/maestro-ios-smoke.sh

      - name: Collect iOS diagnostics
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        run: |
          if [ -n "${IOS_SIMULATOR_UDID:-}" ] && [ ! -f build/maestro/ios/diagnostics/summary.json ]; then
            python3 .github/scripts/collect_ios_diagnostics.py --udid "$IOS_SIMULATOR_UDID" \
              --app-id com.ahn.SharedLedger --process Runner --output build/maestro/ios/diagnostics \
              --started build/maestro/ios/diagnostics-started
          fi

      - name: Upload iOS Maestro results
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-maestro-smoke-results
          path: |
            build/maestro/ios/
            *-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down iOS simulator
        timeout-minutes: 2
        if: always()
        run: |
          if [ -n "${IOS_SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
          fi

  flutter:
    name: Flutter 포맷·분석·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 로컬과 같은 버전을 쓰도록 fvm 설정 파일에서 읽는다.
      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # Flutter 설치용으로 가장 널리 쓰이는 커뮤니티 Action(subosito/flutter-action). SDK를 캐시한다.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # 다른 Flutter 버전으로 lock 파일이 바뀐 채 올라오면 여기서 막는다.
      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test testing

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  firestore-rules:
    name: Firestore 보안 규칙 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # Firestore 에뮬레이터는 Java 21 이상이 필요하다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install test packages
        run: npm --prefix firestore-tests ci

      # demo- 프로젝트라 실제 Firebase 프로젝트에 닿지 않고 로그인도 필요 없다.
      - name: Run rules tests on emulator
        run: >-
          npx --yes firebase-tools@15.20.0 emulators:exec
          --only firestore
          --project demo-shared-ledger
          "npm --prefix firestore-tests test"

  # Cloud Functions(functions/: 공휴일 동기화, 구성원이 빈 가계부 지우기). 타입 검사·빌드와 판단 함수 테스트만 하고 배포는 하지 않는다.
  functions:
    name: Cloud Functions 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 배포되는 런타임(package.json의 engines)과 같은 Node 22로 검사한다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install packages
        run: npm --prefix functions ci

      - name: Build and test
        run: npm --prefix functions test

  android-build:
    name: Android 디버그 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 이 CI는 git push를 하지 않으니 체크아웃 토큰을 git 설정에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter 설치용으로 가장 널리 쓰이는 커뮤니티 Action(subosito/flutter-action). SDK를 캐시한다.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # Gradle 사가 관리하는 공식 Action. flutter build apk가 내부에서 부르는 Gradle의
      # 의존성·배포판을 캐시한다. 캐시는 main 실행에서만 쓰고 PR에서는 읽기만 한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug
