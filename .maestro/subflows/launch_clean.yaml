appId: ${APP_ID}
---
- stopApp
- runScript: ../scripts/reset.js
# 테스트 시작점은 영속 캐시를 쓰지 않고 매번 에뮬레이터에 로그인한다. 앱 데이터를 지울 필요가 없다.
- launchApp:
    clearState: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: remaining-cash
    # iOS 앱·SDK 초기화에는 60초, Android와 직접 실행에는 기본 30초를 쓴다.
    timeout: '${typeof STARTUP_TIMEOUT_MS === "undefined" ? 30000 : STARTUP_TIMEOUT_MS}'
- assertVisible:
    id: remaining-cash
    text: "977,000원"
