appId: ${APP_ID}
---
- stopApp
- runScript: ../scripts/reset.js
# 테스트 시작점은 영속 캐시를 쓰지 않고 매번 에뮬레이터에 로그인한다. 앱 데이터를 지울 필요가 없다.
- launchApp:
    clearState: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: remaining-cash
    # CI의 첫 iOS 워밍업만 콜드스타트 예산을 별도로 받는다. 본 smoke는 30초다.
    timeout: '${typeof STARTUP_TIMEOUT_MS === "undefined" ? 30000 : STARTUP_TIMEOUT_MS}'
- assertVisible:
    id: remaining-cash
    text: "977,000원"
